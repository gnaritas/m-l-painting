<!-- og-src.html — source art for public/og.png (1200x630), not served (repo root, 2026-11-19) -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0a1420;font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;color:#efe9db}
.tape{height:14px;background:repeating-linear-gradient(45deg,#e3b70e 0 18px,#0a1420 18px 36px)}
.main{display:flex;justify-content:space-between;align-items:center;height:600px;padding:36px 64px;font-family:Impact,sans-serif}
.left{max-width:720px}
.eyebrow{font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:19px;letter-spacing:.3em;color:#e3b70e;font-weight:800;text-transform:uppercase}
h1{font-size:118px;line-height:.95;margin:22px 0 10px;color:#fff;letter-spacing:.01em;text-transform:uppercase}
h1 small{display:block;font-size:34px;letter-spacing:.18em;color:#e3b70e;margin-top:6px}
.sub{font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:23px;color:#ccd6df;line-height:1.5;margin:22px 0 30px;max-width:640px}
.chips{display:flex;gap:14px;flex-wrap:wrap}
.chip{border:2px solid #46617a;border-radius:3px;padding:12px 22px;font-size:17px;letter-spacing:.1em;text-transform:uppercase;color:#efe9db;font-family:"Segoe UI",system-ui,Arial,sans-serif;font-weight:800}
.chip.hot{background:#e3b70e;border-color:#e3b70e;color:#0a1420}
.mark{border:4px solid #e3b70e;padding:34px 48px 24px;transform:rotate(-2deg);background:rgba(227,183,14,.06)}
.big5{font-size:150px;line-height:.85;color:#e3b70e}
.markcap{font-family:"Segoe UI",system-ui,Arial,sans-serif;font-size:15px;letter-spacing:.3em;text-transform:uppercase;color:#ccd6df;margin-top:10px;text-align:center}
</style>
</head>
<body>
<div class="tape"></div>
<div class="main">
  <div class="left">
    <div class="eyebrow">Vancouver, Washington &middot; NE 26th St shop</div>
    <h1>M&nbsp;&amp;&nbsp;L<small>Painting</small></h1>
    <div class="sub">Interior &amp; exterior house painting, done the long way: prepped, primed, painted. Office Mon&ndash;Fri 9&ndash;5.</div>
    <div class="chips">
      <div class="chip hot">Call (360) 798-2333</div>
      <div class="chip">5.0 on Google</div>
      <div class="chip">Mon&ndash;Fri 9&ndash;5</div>
    </div>
  </div>
  <div class="mark">
    <div class="big5">5.0</div>
    <div class="markcap">Google rating</div>
  </div>
</div>
<div class="tape"></div>
</body>
</html>
